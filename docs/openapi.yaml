openapi: 3.0.3

info:
  title: Avito Year Recap API
  version: 1.1.0
  description: |
    Публичный REST API MVP «Итоги года» в концепции города.

    Пользователь выбирает тестовый профиль, запускает генерацию персонального
    recap, просматривает карточки с метриками, главным районом города,
    архетипом из роли и стиля поведения, тремя главными достижениями и
    персональной суммаризацией.

  contact:
    name: Avito Hackathon Team
  license:
    name: Proprietary Hackathon MVP

servers:
  - url: /api/v1
    description: API v1

security: []

tags:
  - name: Profiles
    description: Тестовые профили для демонстрации MVP.
  - name: Recaps
    description: Генерация и получение персональных итогов года.
  - name: Explanations
    description: Объяснение детерминированных бизнес-решений.
  - name: Sharing
    description: Безопасная публичная проекция recap.
  - name: Interactions
    description: Продуктовые события просмотра и использования recap.

paths:
  /profiles:
    get:
      tags: [Profiles]
      operationId: listProfiles
      summary: Получить список тестовых профилей
      responses:
        "200":
          description: Список доступных тестовых профилей.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
              examples:
                default:
                  value:
                    profiles:
                      - id: 19369d67-1db3-4e87-b8a8-9c82991ba173
                        name: Алексей
                        description: Изучает разные районы города и сохраняет интересные находки
                        avatar_url: /assets/profiles/alexey.webp
                        scenario: thoughtful_buyer
                        year: 2026
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/{id}:
    get:
      tags: [Profiles]
      operationId: getProfile
      summary: Получить тестовый профиль
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Детали выбранного тестового профиля.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          $ref: "#/components/responses/ProfileNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /recaps:
    post:
      tags: [Recaps]
      operationId: createRecap
      summary: Сформировать итоги года
      description: |
        Создаёт recap для выбранного профиля и года.

        В синхронном MVP endpoint возвращает `201 Created`, `status=ready` и
        готовый объект `recap`. Контракт также допускает `202 Accepted` для
        будущей фоновой генерации.

        Повтор запроса с тем же `Idempotency-Key` и тем же телом возвращает
        тот же `recap_id`. Использование ключа с другим телом возвращает `409`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecapRequest"
      responses:
        "201":
          description: Recap синхронно сформирован.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRecapResponse"
              examples:
                ready:
                  value:
                    recap_id: 6dfc1418-e106-49ab-b839-c9498418e8f6
                    status: ready
                    links:
                      self: /api/v1/recaps/6dfc1418-e106-49ab-b839-c9498418e8f6
                      explanation: /api/v1/recaps/6dfc1418-e106-49ab-b839-c9498418e8f6/explanation
                      share: /api/v1/recaps/6dfc1418-e106-49ab-b839-c9498418e8f6/share
        "202":
          description: Генерация принята в обработку.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRecapResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          $ref: "#/components/responses/ProfileNotFound"
        "409":
          description: Конфликт idempotency или уже выполняющаяся генерация.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          $ref: "#/components/responses/InsufficientActivity"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /recaps/{id}:
    get:
      tags: [Recaps]
      operationId: getRecap
      summary: Получить статус или готовый recap
      parameters:
        - $ref: "#/components/parameters/RecapId"
      responses:
        "200":
          description: Текущее состояние или готовые итоги года.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recap"
              examples:
                ready:
                  $ref: "#/components/examples/ReadyRecap"
                processing:
                  value:
                    id: 6dfc1418-e106-49ab-b839-c9498418e8f6
                    status: processing
                    year: 2026
                    progress:
                      stage: narrative
                      percent: 80
        "404":
          $ref: "#/components/responses/RecapNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /recaps/{id}/explanation:
    get:
      tags: [Explanations]
      operationId: getRecapExplanation
      summary: Получить объяснение решений recap
      description: |
        Возвращает причины выбора роли пользователя, стиля поведения и
        достижений. Внутренние числовые score не являются частью публичного
        контракта.
      parameters:
        - $ref: "#/components/parameters/RecapId"
      responses:
        "200":
          description: Детерминированные причины бизнес-решений.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecapExplanation"
        "404":
          $ref: "#/components/responses/RecapNotFound"
        "409":
          description: Recap ещё не готов для формирования объяснения.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          $ref: "#/components/responses/InternalError"

  /recaps/{id}/share:
    get:
      tags: [Sharing]
      operationId: getShareCard
      summary: Получить безопасную публичную share-card
      parameters:
        - $ref: "#/components/parameters/RecapId"
      responses:
        "200":
          description: Публичная проекция итогов без приватных полей.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareCard"
        "404":
          $ref: "#/components/responses/RecapNotFound"
        "409":
          description: Share-card недоступна для данного recap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          $ref: "#/components/responses/InternalError"

  /recaps/{id}/interactions:
    post:
      tags: [Interactions]
      operationId: createRecapInteraction
      summary: Зафиксировать продуктовое взаимодействие
      description: Повтор `event_id` не должен создавать дубликат события.
      parameters:
        - $ref: "#/components/parameters/RecapId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteractionRequest"
      responses:
        "202":
          description: Событие принято.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          $ref: "#/components/responses/RecapNotFound"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    ProfileId:
      name: id
      in: path
      required: true
      description: UUID тестового профиля.
      schema:
        type: string
        format: uuid

    RecapId:
      name: id
      in: path
      required: true
      description: UUID recap.
      schema:
        type: string
        format: uuid

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Ключ идемпотентности создания recap.
      schema:
        type: string
        minLength: 1
        maxLength: 200

  responses:
    InvalidArgument:
      description: Запрос содержит невалидные данные.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"

    ProfileNotFound:
      description: Тестовый профиль не найден.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"

    RecapNotFound:
      description: Recap не найден.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"

    InsufficientActivity:
      description: Для генерации итогов недостаточно активности.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"

    RateLimitExceeded:
      description: Превышен лимит запросов.
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить запрос.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"

    DependencyUnavailable:
      description: Критическая внешняя зависимость временно недоступна. Ошибка Mistral сюда не относится, поскольку используется template fallback.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"

    InternalError:
      description: Необработанная внутренняя ошибка.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"

  schemas:
    ProfileSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - scenario
        - year
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Алексей
        description:
          type: string
          maxLength: 300
          example: Изучает разные районы города и сохраняет интересные находки
        avatar_url:
          type: string
          nullable: true
          format: uri-reference
          example: /assets/profiles/alexey.webp
        scenario:
          type: string
          minLength: 1
          maxLength: 100
          example: thoughtful_buyer
          description: Стабильный машинный код тестового сценария.
        year:
          type: integer
          minimum: 2000
          maximum: 2100
          example: 2026

    ProfileList:
      type: object
      additionalProperties: false
      required: [profiles]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileSummary"

    Profile:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - scenario
        - available_years
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        avatar_url:
          type: string
          nullable: true
          format: uri-reference
        scenario:
          type: string
          minLength: 1
          maxLength: 100
        available_years:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 2000
            maximum: 2100

    CreateRecapRequest:
      type: object
      additionalProperties: false
      required:
        - profile_id
        - year
      properties:
        profile_id:
          type: string
          format: uuid
        year:
          type: integer
          minimum: 2000
          maximum: 2100
          example: 2026

    RecapStatus:
      type: string
      enum:
        - queued
        - processing
        - ready
        - failed

    RecapLinks:
      type: object
      additionalProperties: false
      required: [self]
      properties:
        self:
          type: string
          format: uri-reference
        explanation:
          type: string
          nullable: true
          format: uri-reference
        share:
          type: string
          nullable: true
          format: uri-reference

    CreateRecapResponse:
      type: object
      additionalProperties: false
      required:
        - recap_id
        - status
        - links
      properties:
        recap_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RecapStatus"
        poll_after_ms:
          type: integer
          nullable: true
          minimum: 0
          example: 0
        recap:
          $ref: "#/components/schemas/ReadyRecap"
        links:
          $ref: "#/components/schemas/RecapLinks"

    Recap:
      oneOf:
        - $ref: "#/components/schemas/PendingRecap"
        - $ref: "#/components/schemas/ReadyRecap"
        - $ref: "#/components/schemas/FailedRecap"
      discriminator:
        propertyName: status
        mapping:
          queued: "#/components/schemas/PendingRecap"
          processing: "#/components/schemas/PendingRecap"
          ready: "#/components/schemas/ReadyRecap"
          failed: "#/components/schemas/FailedRecap"

    PendingRecap:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - year
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing]
        year:
          type: integer
          minimum: 2000
          maximum: 2100
        progress:
          $ref: "#/components/schemas/RecapProgress"

    RecapProgress:
      type: object
      additionalProperties: false
      required:
        - stage
        - percent
      properties:
        stage:
          type: string
          enum:
            - loading_activity
            - calculating_metrics
            - selecting_archetype
            - selecting_achievements
            - narrative
            - assembling
        percent:
          type: integer
          minimum: 0
          maximum: 100

    ReadyRecap:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - id
        - profile_id
        - status
        - year
        - profile
        - generation
        - theme
        - cards
        - capabilities
      properties:
        schema_version:
          type: string
          example: "1.1"
        id:
          type: string
          format: uuid
        profile_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ready]
        year:
          type: integer
          minimum: 2000
          maximum: 2100
          example: 2026
        profile:
          $ref: "#/components/schemas/RecapProfile"
        generation:
          $ref: "#/components/schemas/RecapGeneration"
        theme:
          $ref: "#/components/schemas/RecapTheme"
        cards:
          type: array
          minItems: 5
          maxItems: 20
          description: Карточки возвращаются отсортированными по position.
          items:
            $ref: "#/components/schemas/RecapCard"
        capabilities:
          $ref: "#/components/schemas/RecapCapabilities"

    FailedRecap:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - year
        - error
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [failed]
        year:
          type: integer
          minimum: 2000
          maximum: 2100
        error:
          $ref: "#/components/schemas/APIError"

    RecapProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Алексей
        avatar_url:
          type: string
          nullable: true
          format: uri-reference

    RecapGeneration:
      type: object
      additionalProperties: false
      required:
        - algorithm_version
        - feature_schema_version
        - activity_hash
        - generated_at
        - narrative
      properties:
        algorithm_version:
          type: string
          example: recap-rules-2026.08.2
        feature_schema_version:
          type: string
          example: features-v1
        activity_hash:
          type: string
          pattern: '^sha256:[a-fA-F0-9]{16,}$'
          example: sha256:3898bb923e7c9926f5ad3dc8c76895d9
        generated_at:
          type: string
          format: date-time
        narrative:
          $ref: "#/components/schemas/NarrativeGeneration"

    NarrativeGeneration:
      type: object
      additionalProperties: false
      required:
        - source
        - prompt_version
      properties:
        source:
          type: string
          enum:
            - mistral
            - template
          description: Фактический источник текста суммаризации.
        prompt_version:
          type: string
          example: city-summary-v1
        model:
          type: string
          nullable: true
          example: mistral-small-latest

    RecapTheme:
      type: object
      additionalProperties: false
      required:
        - code
        - main_district
      properties:
        code:
          type: string
          enum: [city]
        main_district:
          type: string
          example: goods
          description: Код главной вертикали, определяющей визуальный вариант города.
        accent_token:
          type: string
          nullable: true
          example: violet

    RecapCapabilities:
      type: object
      additionalProperties: false
      required:
        - share_available
        - explanation_available
        - feedback_available
        - all_achievements_available
      properties:
        share_available:
          type: boolean
        explanation_available:
          type: boolean
        feedback_available:
          type: boolean
        all_achievements_available:
          type: boolean
          description: Можно ли открыть полный список достижений помимо top-3.

    RecapCard:
      oneOf:
        - $ref: "#/components/schemas/IntroCard"
        - $ref: "#/components/schemas/MetricCard"
        - $ref: "#/components/schemas/DistrictCard"
        - $ref: "#/components/schemas/ArchetypeCard"
        - $ref: "#/components/schemas/AchievementsCard"
        - $ref: "#/components/schemas/SummaryCard"
        - $ref: "#/components/schemas/FinalCard"
      discriminator:
        propertyName: type
        mapping:
          intro: "#/components/schemas/IntroCard"
          metric: "#/components/schemas/MetricCard"
          district: "#/components/schemas/DistrictCard"
          archetype: "#/components/schemas/ArchetypeCard"
          achievements: "#/components/schemas/AchievementsCard"
          summary: "#/components/schemas/SummaryCard"
          final: "#/components/schemas/FinalCard"

    BaseRecapCard:
      type: object
      required:
        - id
        - type
        - position
        - visibility
        - title
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
          example: top-district
        type:
          type: string
        position:
          type: integer
          minimum: 0
        visibility:
          $ref: "#/components/schemas/CardVisibility"
        eyebrow:
          type: string
          nullable: true
          maxLength: 100
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          nullable: true
          maxLength: 500
        visual:
          $ref: "#/components/schemas/CardVisual"
        explainable:
          type: boolean
          default: false

    CardVisibility:
      type: string
      enum:
        - personal
        - shareable

    CardVisual:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum:
            - illustration
            - district
            - street
            - calendar
            - badge
            - chart
            - character
            - skyline
        asset_code:
          type: string
          nullable: true
          example: goods-electronics

    IntroCard:
      allOf:
        - $ref: "#/components/schemas/BaseRecapCard"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [intro]
            data:
              type: object
              additionalProperties: false
              required: [year]
              properties:
                year:
                  type: integer
                  minimum: 2000
                  maximum: 2100

    MetricCard:
      allOf:
        - $ref: "#/components/schemas/BaseRecapCard"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [metric]
            data:
              type: object
              additionalProperties: false
              required:
                - metric_code
                - value
              properties:
                metric_code:
                  $ref: "#/components/schemas/MetricCode"
                value:
                  type: number
                  example: 84
                unit:
                  type: string
                  nullable: true
                  example: days
                secondary_label:
                  type: string
                  nullable: true
                  maxLength: 200
                  example: Активность была заметна в 11 месяцах

    MetricCode:
      type: string
      description: |
        Стабильный машинный код числовой метрики. Поддерживаемые MVP-значения:
        `meaningful_events`, `active_days`, `active_months`,
        `max_activity_streak`, `views_count`, `favorites_count`,
        `saved_searches_count`, `chats_started_count`,
        `published_listings_count`, `sales_count`, `purchases_count`,
        `delivery_count`, `unique_categories`, `unique_verticals`,
        `top_vertical_share`, `top_category_share`,
        `buyer_actions_count`, `seller_actions_count`,
        `completed_deals_count`, `favorite_to_purchase_rate`,
        `publish_to_sale_rate`, `delivery_usage_rate`.
      example: active_days

    DistrictCard:
      allOf:
        - $ref: "#/components/schemas/BaseRecapCard"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [district]
            data:
              type: object
              additionalProperties: false
              required:
                - vertical_code
                - vertical_title
                - activity_share
              properties:
                vertical_code:
                  type: string
                  example: goods
                vertical_title:
                  type: string
                  example: Товары
                activity_share:
                  type: number
                  minimum: 0
                  maximum: 1
                  example: 0.43
                top_street:
                  $ref: "#/components/schemas/CityStreet"

    CityStreet:
      type: object
      additionalProperties: false
      required:
        - category_code
        - category_title
      properties:
        category_code:
          type: string
          example: electronics
        category_title:
          type: string
          example: Электроника

    ArchetypeCard:
      allOf:
        - $ref: "#/components/schemas/BaseRecapCard"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [archetype]
            data:
              type: object
              additionalProperties: false
              required:
                - role
                - style
              properties:
                role:
                  $ref: "#/components/schemas/ArchetypeRole"
                style:
                  $ref: "#/components/schemas/ArchetypeStyle"

    ArchetypeRole:
      type: object
      additionalProperties: false
      required:
        - code
        - title
      properties:
        code:
          $ref: "#/components/schemas/ArchetypeRoleCode"
        title:
          type: string
          maxLength: 100
          example: Искатель находок

    ArchetypeRoleCode:
      type: string
      enum:
        - findings_seeker
        - showcase_owner
        - universal_citizen
        - city_observer

    ArchetypeStyle:
      type: object
      additionalProperties: false
      required:
        - code
        - title
      properties:
        code:
          $ref: "#/components/schemas/ArchetypeStyleCode"
        title:
          type: string
          maxLength: 100
          example: Вдумчивый

    ArchetypeStyleCode:
      type: string
      enum:
        - thoughtful
        - explorer
        - district_expert
        - regular
        - result_oriented
        - city_local

    AchievementsCard:
      allOf:
        - $ref: "#/components/schemas/BaseRecapCard"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [achievements]
            data:
              type: object
              additionalProperties: false
              required:
                - items
                - total_count
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 3
                  description: Три наиболее приоритетных достижения пользователя.
                  items:
                    $ref: "#/components/schemas/AchievementItem"
                total_count:
                  type: integer
                  minimum: 1
                  description: Полное число полученных достижений.

    AchievementItem:
      type: object
      additionalProperties: false
      required:
        - code
        - title
        - description
        - level
        - icon
      properties:
        code:
          $ref: "#/components/schemas/AchievementCode"
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 300
        level:
          $ref: "#/components/schemas/AchievementLevel"
        icon:
          type: string
          maxLength: 100
          example: deal-master-guru
        metric_code:
          $ref: "#/components/schemas/MetricCode"
        current_value:
          type: number
          nullable: true
        next_level_threshold:
          type: number
          nullable: true

    AchievementCode:
      type: string
      enum:
        - deal_master
        - findings_collector
        - city_navigator
        - frequent_guest
        - old_timer
        - doorstep_delivery
        - own_showcase
        - findings_hunter
        - city_rhythm

    AchievementLevel:
      type: string
      enum:
        - newcomer
        - local
        - expert
        - guru
      description: |
        Уровни достижения: `newcomer` — Новичок, `local` — Местный,
        `expert` — Знаток, `guru` — Гуру.

    SummaryCard:
      allOf:
        - $ref: "#/components/schemas/BaseRecapCard"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [summary]
            data:
              type: object
              additionalProperties: false
              required:
                - role_code
                - style_code
                - achievement_codes
              properties:
                role_code:
                  $ref: "#/components/schemas/ArchetypeRoleCode"
                style_code:
                  $ref: "#/components/schemas/ArchetypeStyleCode"
                achievement_codes:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    $ref: "#/components/schemas/AchievementCode"

    FinalCard:
      allOf:
        - $ref: "#/components/schemas/BaseRecapCard"
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [final]
            data:
              type: object
              additionalProperties: false
              required:
                - show_share_button
                - show_feedback
              properties:
                show_share_button:
                  type: boolean
                show_feedback:
                  type: boolean

    RecapExplanation:
      type: object
      additionalProperties: false
      required:
        - recap_id
        - algorithm_version
        - activity_hash
        - decisions
      properties:
        recap_id:
          type: string
          format: uuid
        algorithm_version:
          type: string
        activity_hash:
          type: string
        decisions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DecisionExplanation"

    DecisionExplanation:
      type: object
      additionalProperties: false
      required:
        - card_id
        - kind
        - code
        - reason
        - rule_version
        - facts
      properties:
        card_id:
          type: string
        kind:
          type: string
          enum:
            - archetype_role
            - archetype_style
            - achievement
        code:
          type: string
          example: findings_seeker
        reason:
          type: string
          maxLength: 500
        rule_version:
          type: string
          example: archetype-rules-v1
        facts:
          type: array
          items:
            $ref: "#/components/schemas/RuleFact"

    RuleFact:
      type: object
      additionalProperties: false
      required:
        - metric_code
        - actual
        - operator
        - threshold
        - matched
      properties:
        metric_code:
          $ref: "#/components/schemas/MetricCode"
        actual:
          type: number
        operator:
          type: string
          enum: [eq, neq, gt, gte, lt, lte]
        threshold:
          type: number
        matched:
          type: boolean

    ShareCard:
      type: object
      additionalProperties: false
      description: |
        Безопасная публичная проекция recap. Не содержит `profile_id`,
        идентификаторы объявлений, точные покупки и цены, данные собеседников,
        тексты сообщений, внутренние коэффициенты и приватные карточки.
      required:
        - schema_version
        - recap_id
        - profile_name
        - year
        - title
        - subtitle
        - archetype
        - facts
        - achievements
        - visual
      properties:
        schema_version:
          type: string
          example: "1.1"
        recap_id:
          type: string
          format: uuid
        profile_name:
          type: string
          maxLength: 100
          example: Алексей
        year:
          type: integer
          minimum: 2000
          maximum: 2100
          example: 2026
        title:
          type: string
          maxLength: 120
          example: Мой год в городе Авито
        subtitle:
          type: string
          maxLength: 200
          example: Вдумчивый искатель находок
        archetype:
          $ref: "#/components/schemas/ShareArchetype"
        facts:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/ShareFact"
        achievements:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/ShareAchievement"
        visual:
          $ref: "#/components/schemas/ShareVisual"

    ShareArchetype:
      type: object
      additionalProperties: false
      required:
        - role_title
        - style_title
      properties:
        role_title:
          type: string
          example: Искатель находок
        style_title:
          type: string
          example: Вдумчивый

    ShareFact:
      type: object
      additionalProperties: false
      required: [key, label, value]
      properties:
        key:
          type: string
          example: main_district
        label:
          type: string
          example: Главный район
        value:
          type: string
          example: Товары

    ShareAchievement:
      type: object
      additionalProperties: false
      required:
        - code
        - title
        - level
        - icon
      properties:
        code:
          $ref: "#/components/schemas/AchievementCode"
        title:
          type: string
          example: Городской навигатор
        level:
          $ref: "#/components/schemas/AchievementLevel"
        icon:
          type: string
          example: city-navigator-expert

    ShareVisual:
      type: object
      additionalProperties: false
      required:
        - theme
        - main_district
        - colors
      properties:
        theme:
          type: string
          enum: [city]
        main_district:
          type: string
          example: goods
        colors:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            pattern: '^#[0-9A-Fa-f]{6}$'
          example: ["#7C3AED", "#F3E8FF"]

    InteractionRequest:
      type: object
      additionalProperties: false
      required:
        - event_id
        - session_id
        - event_name
        - occurred_at
      properties:
        event_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        event_name:
          type: string
          enum:
            - recap_opened
            - card_viewed
            - explanation_opened
            - recap_completed
            - share_preview_opened
            - share_clicked
            - achievements_expanded
            - feedback_submitted
        occurred_at:
          type: string
          format: date-time
        properties:
          type: object
          additionalProperties: true
          default: {}

    InteractionResponse:
      type: object
      additionalProperties: false
      required:
        - accepted
        - recap_id
      properties:
        accepted:
          type: boolean
          example: true
        recap_id:
          type: string
          format: uuid

    APIError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          enum:
            - invalid_argument
            - profile_not_found
            - recap_not_found
            - recap_not_ready
            - insufficient_activity
            - idempotency_conflict
            - recap_already_generating
            - rate_limit_exceeded
            - dependency_unavailable
            - internal_error
        message:
          type: string
          example: Test profile was not found
        request_id:
          type: string
          format: uuid
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        field:
          type: string
          nullable: true
          example: profile_id
        reason:
          type: string
          example: unknown_value

  examples:
    ReadyRecap:
