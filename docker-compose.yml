services:
  postgres:
    image: postgres:15-alpine
    container_name: avito-recap-postgres
    environment:
      POSTGRES_USER: avito
      POSTGRES_PASSWORD: avito_password
      POSTGRES_DB: avito_recap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_postgres_init.sql:/docker-entrypoint-initdb.d/001_postgres_init.sql:ro
      - ./backend/migrations/002_seed_data.sql:/docker-entrypoint-initdb.d/002_seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avito -d avito_recap"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: avito-recap-clickhouse
    environment:
      CLICKHOUSE_DB: recap
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./backend/migrations/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    env_file:
      - ./backend/.env
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avito-recap-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: avito
      DB_PASSWORD: avito_password
      DB_NAME: avito_recap
      DB_SSLMODE: disable
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: recap
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      SERVER_PORT: 8080
  
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

    restart: on-failure

volumes:
  postgres_data:
  clickhouse_data:
