version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: avito-recap-postgres
    environment:
      POSTGRES_USER: avito
      POSTGRES_PASSWORD: avito_password
      POSTGRES_DB: avito_recap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avito -d avito_recap"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avito-recap-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: avito
      DB_PASSWORD: avito_password
      DB_NAME: avito_recap
      SERVER_PORT: 8080
      ENVIRONMENT: production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: avito-recap-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: